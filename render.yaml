# Render blueprint -- free tier.
#
# The web service does no heavy computation: factors are precomputed by the
# nightly GitHub Actions worker and backtests run there too, so this instance
# only reads SQL and serves JSON. That is what keeps it viable on 512 MB.
#
# The free tier has no persistent disk (all state lives in Neon) and no cron
# jobs, which is why ingest runs in GitHub Actions instead. See
# .github/workflows/ingest-nightly.yml.
services:
  - type: web
    name: screener-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: >-
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GROWW_API_KEY
        sync: false
      - key: GROWW_SECRET
        sync: false
      - key: INDIAN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: screener-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback so client-side routes deep-link correctly.
      - type: rewrite
        source: /*
        destination: /index.html
