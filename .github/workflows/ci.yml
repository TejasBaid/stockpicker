name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Set at job level so the step-level `if` below can actually read it --
      # a step's own `env:` block is not available to its own condition.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check app tests
      - name: Format
        run: uv run ruff format --check app tests
      - name: Types
        run: uv run mypy app

      - name: requirements.txt matches uv.lock
        # Render installs from requirements.txt, so it must not drift from the
        # lock file the tests run against. Regenerated in place and diffed with
        # git: the export writes its own output path into a header comment, so
        # exporting elsewhere and diffing would always differ.
        run: |
          uv export --no-dev --no-hashes --no-emit-project -o requirements.txt
          git diff --exit-code -- requirements.txt

      - name: Tests
        # Forked pull requests do not receive secrets, so the database-backed
        # suite is skipped there rather than failing noisily.
        if: env.DATABASE_URL != ''
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc -b --noEmit
      - name: Build
        run: npm run build
